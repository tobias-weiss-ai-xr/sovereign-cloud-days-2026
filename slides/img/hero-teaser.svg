<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06101f"/>
      <stop offset="50%" stop-color="#0a1a33"/>
      <stop offset="100%" stop-color="#06101f"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#1a7f6b"/>
      <stop offset="100%" stop-color="#0b6e99"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- golden section guides -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="458" y1="0" x2="458" y2="420"/>
    <line x1="742" y1="0" x2="742" y2="420"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="260" x2="1200" y2="260"/>
  </g>

  <!-- left: hexagon (sovereign cloud container) -->
  <g transform="translate(120,80)" filter="url(#glow)">
    <polygon points="120,0 240,60 240,180 120,240 0,180 0,60"
             fill="none" stroke="url(#acc)" stroke-width="3"/>
    <polygon points="120,30 210,75 210,165 120,210 30,165 30,75"
             fill="#0b6e99" fill-opacity="0.12" stroke="#0b6e99" stroke-width="1.5"/>
    <text x="120" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#ffffff">SOVEREIGN</text>
    <text x="120" y="152" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#1a7f6b">CLOUD</text>
  </g>

  <!-- center: agent nodes (triangles) connected by straight lines -->
  <g stroke="url(#acc)" stroke-width="2" fill="none">
    <line x1="458" y1="120" x2="600" y2="210"/>
    <line x1="600" y1="210" x2="742" y2="120"/>
    <line x1="458" y1="300" x2="600" y2="210"/>
    <line x1="600" y1="210" x2="742" y2="300"/>
    <line x1="458" y1="120" x2="458" y2="300"/>
    <line x1="742" y1="120" x2="742" y2="300"/>
  </g>
  <g filter="url(#glow)">
    <polygon points="458,100 478,135 438,135" fill="#d4a017"/>
    <polygon points="600,190 622,225 578,225" fill="#1a7f6b"/>
    <polygon points="742,100 762,135 722,135" fill="#0b6e99"/>
    <polygon points="458,280 478,315 438,315" fill="#0b6e99"/>
    <polygon points="742,280 762,315 722,315" fill="#d4a017"/>
  </g>
  <g font-family="Inter,sans-serif" font-size="11" fill="#ffffff" opacity="0.7" text-anchor="middle">
    <text x="458" y="160">observe</text>
    <text x="600" y="250">predict</text>
    <text x="742" y="160">alert</text>
    <text x="458" y="340">maintain</text>
    <text x="742" y="340">verify</text>
  </g>

  <!-- right: shield (sovereignty) -->
  <g transform="translate(900,100)" filter="url(#glow)">
    <polygon points="60,0 120,30 120,130 60,170 0,130 0,30"
             fill="none" stroke="#d4a017" stroke-width="3"/>
    <polygon points="60,20 100,40 100,115 60,145 20,115 20,40"
             fill="#d4a017" fill-opacity="0.12" stroke="#d4a017" stroke-width="1.5"/>
    <polyline points="35,85 55,105 85,65" fill="none" stroke="#1a7f6b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#ffffff">SEAL-1+</text>
  </g>

  <!-- title -->
  <text x="60" y="360" font-family="Inter,sans-serif" font-size="40" font-weight="800" fill="#ffffff">
    Agentic AI
  </text>
  <text x="60" y="400" font-family="Inter,sans-serif" font-size="40" font-weight="800" fill="#1a7f6b">
    meets Sovereign Cloud
  </text>

  <!-- footer tag -->
  <text x="1140" y="405" font-family="Inter,sans-serif" font-size="11" fill="#ffffff" opacity="0.4" text-anchor="end">
    #SCD2026
  </text>
</svg>